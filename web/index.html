<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="halal_scanner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>halal_scanner</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="consent-banner" role="dialog" aria-live="polite" style="position:fixed;bottom:0;left:0;right:0;background:#13010C;color:#fff;padding:16px;z-index:9999;font-family:sans-serif;border-top:2px solid #8E0A57;">
    <p style="margin:0;font-size:14px;">We use third-party services (Firebase, Google Sign-In, Open Food Facts, OpenStreetMap) that may process your data. By using this site you consent to our <a href="https://github.com/kayting4000/Halalcheck/blob/main/docs/PRIVACY_POLICY.md" style="color:#FF6EC7;">Privacy Policy</a>. <button id="consent-accept" style="background:#8E0A57;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;margin-left:8px;">Accept</button></p>
  </div>
  <script>
    (function() {
      var banner = document.getElementById('consent-banner');
      var accept = document.getElementById('consent-accept');
      if (localStorage.getItem('halalcheck_consent')) { banner.style.display = 'none'; }
      accept.addEventListener('click', function() { localStorage.setItem('halalcheck_consent', '1'); banner.style.display = 'none'; });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
