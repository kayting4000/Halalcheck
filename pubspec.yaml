name: halal_scanner
description: Halal Food Scanner App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  google_sign_in: ^6.2.1
  # AI
  http: ^1.2.0
  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.0.0
  # Camera
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  # Barcode (uses v7 API: controller.barcodes / capture.barcodes)
  mobile_scanner: ^7.0.0
  # On-device OCR (ML Kit) - free, no API key, offline
  google_mlkit_text_recognition: ^0.17.1
  # UI
  flutter_animate: ^4.5.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#8E0A57"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
